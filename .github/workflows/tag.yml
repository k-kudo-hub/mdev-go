name: Tag on merge

# PR マージ時に bump:* ラベルへ応じた semver タグを自動生成する。
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# 同時マージによるタグ算出の競合を避ける(直列化する)。
concurrency:
  group: tag-on-merge
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    # macos-latest で組む。Go のリンカが darwin 向けバイナリへ付ける
    # ad-hoc 署名は macOS 上でこそ確実で、Linux からのクロスコンパイルでは
    # 「壊れている」と見なされて起動できないことがある(ADR-0004 D2)。
    # ci.yml と同じランナーでもある。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # タグと全履歴を取得するため
          # 既定のマージref(refs/pull/N/merge)ではなくマージ後のmainを取得する。
          # これによりタグがmainの実コミットを指し、git describe から到達可能になる。
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Determine bump level from PR labels
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          level=""
          # 優先度: major > minor > patch(複数付与時は上位を採用)
          for l in major minor patch; do
            if echo "$LABELS" | jq -e --arg n "bump:$l" 'index($n) != null' >/dev/null; then
              level="$l"
              break
            fi
          done
          if [ -z "$level" ]; then
            echo "No bump:* label found; skipping tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "level=$level" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.bump.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true
          # ci.yml と同じ理由(actions/setup-go#427)でキーを明示する。
          cache-dependency-path: |
            go.mod
            Makefile

      # **タグを作る前にバイナリを組む。** ここで失敗したらタグ自体が
      # 作られないので、「タグはあるがリリースが無い」状態が残らない。
      # 版はこれから打つタグを先に計算して焼き込む。
      - name: Build release binaries
        id: build
        if: steps.bump.outputs.skip != 'true'
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
        run: |
          current=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          next=$(bash scripts/bump-version.sh "$LEVEL" "$current")
          echo "Bumping $current -> $next ($LEVEL)"
          echo "next=$next" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$next" \
              -o "dist/mdev_darwin_$arch" ./cmd/mdev
          done
          # 自己更新は取得したバイナリをこの一覧と突き合わせてから置き換える。
          # 名前だけを載せるため dist の中で実行する。
          (cd dist && shasum -a 256 mdev_darwin_* > checksums.txt)
          ls -l dist

      # タグを打った直後にリリースを作る。**作成と添付は 1 コマンド**で行う
      # (ADR-0004 D2)。分けると「リリースはあるがバイナリがまだ無い」時間帯が
      # でき、その間に走った update が失敗する。
      #
      # タグの push からリリース作成までの数秒だけは「タグはあるがリリースが
      # 無い」状態になるが、update はリリースを見に行くので取りこぼしにはならず、
      # 次に叩けば拾える。
      - name: Create release with binaries
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.build.outputs.next }}
        run: |
          git tag "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" --generate-notes --title "$NEXT" dist/*

      # 添付が欠けたまま緑になると、次の `mdev update` が失敗して初めて
      # 気づくことになる。ここで確かめて落とす(ADR-0004 D9-3)。
      - name: Verify release assets
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.build.outputs.next }}
        run: |
          assets=$(gh release view "$NEXT" --json assets --jq '[.assets[].name] | sort | join(",")')
          echo "assets: $assets"
          expected="checksums.txt,mdev_darwin_amd64,mdev_darwin_arm64"
          if [ "$assets" != "$expected" ]; then
            echo "アセットが揃っていません(expected: $expected)" >&2
            exit 1
          fi
